name: Publish forecast dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/dashboard-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: forecast-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test dashboard/tests/core.test.mjs
      - run: test -f dashboard/data/manifest.json && test -f dashboard/vendor/plotly.min.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
