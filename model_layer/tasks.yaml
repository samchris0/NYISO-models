global_tasks:

  - name: create_jobs
    task_name: tasks.create_jobs
    type: interval
    minutes: 1

  - name: dispatch-training-jobs
    task_name: tasks.dispatch_training_jobs
    type: interval
    minutes: 1

  - name: dispatch-prediction-jobs
    task_name: tasks.dispatch_prediction_jobs
    type: interval
    minutes: 1

  - name: evaluate-pending-predictions
    task_name: tasks.evaluate
    type: interval
    minutes: 5

  - name: ingest-current-realtime-lbmp-zonal
    task_name: tasks.ingest_realtime_lbmp_zonal
    type: interval
    minutes: 5
