models:
  - enabled: true
    config:
      name: seasonal_naive
      model_type: seasonal_naive
      ptid: 61757
      training_window_days: 1
      interval_minutes: 5
      forecast_intervals: 1
    tasks:
      - task_name: tasks.predict
        type: interval
        minutes: 5
      - task_name: tasks.train
        type: cron
        minutes: 0
        hours: 0

  - enabled: false
    config:
      name: auto_arima_daily
      model_type: auto_arima
      enabled: true
      updates: true
      ptid: 61757
      training_window_days: 31
      interval_minutes: 5
      forecast_intervals: 1
      hyperparameters:
        seasonal: true
        period_days: 1
    tasks:
      - task_name: tasks.predict
        type: interval
        minutes: 5
      - task_name: tasks.train
        type: cron
        minutes: 0
        hours: 0
      - task_name: tasks.update
        type: cron
        minutes: "*/5"

