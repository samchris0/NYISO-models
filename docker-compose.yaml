services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  nyiso-api:
    build: .
    command: python -u -m nyiso_api.main
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}"
    volumes:
      - ./nyiso_api:/app/nyiso_api
    ports:
      - "5001:5050"
    depends_on:
      db:
        condition: service_healthy
  
  model-db-init:
    build: .
    command: python -c "from model_layer.db.init_db import init_db; init_db()"
    environment:
      DATABASE_URL: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}"
    depends_on:
      db:
        condition: service_healthy

  forecast-run-init:
    build: .
    command:
      - python
      - -m
      - model_layer.init_models
      - /app/model_layer/forecast_runs.yaml
    environment:
      DATABASE_URL: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}"
    volumes:
      - ./model_layer:/app/model_layer:ro
    depends_on:
      model-db-init:
        condition: service_completed_successfully
    restart: "no"

  training-worker:
    build: .
    command:
      - celery
      - -A
      - model_layer.celery.celery_app:app
      - worker
      - --queues=training
      - --concurrency=1
    environment:
      DATABASE_URL: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}"
      CELERY_BROKER_URL: redis://redis:6379/0
      NYISO_API_BASE_URL: http://nyiso-api:5050
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      nyiso-api:
        condition: service_started
      model-db-init:
        condition: service_completed_successfully
    volumes:
      - ./model_layer:/app/model_layer
      - model_artifacts:/app/model_layer/artifacts

  predicting-worker:
    build: .
    command:
      - celery
      - -A
      - model_layer.celery.celery_app:app
      - worker
      - --queues=predicting
      - --concurrency=2
    environment:
      DATABASE_URL: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}"
      CELERY_BROKER_URL: redis://redis:6379/0
      NYISO_API_BASE_URL: http://nyiso-api:5050
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      nyiso-api:
        condition: service_started
      model-db-init:
        condition: service_completed_successfully
    volumes:
      - ./model_layer:/app/model_layer
      - model_artifacts:/app/model_layer/artifacts

  updating-worker:
    build: .
    command:
      - celery
      - -A
      - model_layer.celery.celery_app:app
      - worker
      - --queues=updating
      - --concurrency=2
    environment:
      DATABASE_URL: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}"
      CELERY_BROKER_URL: redis://redis:6379/0
      NYISO_API_BASE_URL: http://nyiso-api:5050
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      nyiso-api:
        condition: service_started
      model-db-init:
        condition: service_completed_successfully
    volumes:
      - ./model_layer:/app/model_layer
      - model_artifacts:/app/model_layer/artifacts

  evaluating-worker:
    build: .
    command:
      - celery
      - -A
      - model_layer.celery.celery_app:app
      - worker
      - --queues=evaluating
      - --concurrency=1
    environment:
      DATABASE_URL: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}"
      CELERY_BROKER_URL: redis://redis:6379/0
      NYISO_API_BASE_URL: http://nyiso-api:5050
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      nyiso-api:
        condition: service_started
      model-db-init:
        condition: service_completed_successfully

  ingesting-worker:
    build: .
    command:
      - celery
      - -A
      - model_layer.celery.celery_app:app
      - worker
      - --queues=ingesting
      - --concurrency=1
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      NYISO_API_BASE_URL: http://nyiso-api:5050
    depends_on:
      redis:
        condition: service_started
      nyiso-api:
        condition: service_started

  scheduler:
    build: .
    command:
      - celery
      - -A
      - model_layer.celery.celery_app:app
      - beat
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started


volumes:
  postgres_data:
  model_artifacts:
