services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nyiso-api:
    build: .
    command: python -u -m nyiso_api.main
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}"
    volumes:
      - ./nyiso_api:/app/nyiso_api
    ports:
      - "5001:5050"
    depends_on:
      db:
        condition: service_healthy

  model-layer:
    build: .
    command: python -u -m model_layer.main
    env_file: .env
    environment:
      NYISO_API_BASE_URL: http://nyiso-api:5050
      DATABASE_URL: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}"
    depends_on:
      db:
        condition: service_healthy
      nyiso-api:
        condition: service_started
    volumes:
      - ./model_layer:/app/model_layer
      - model_artifacts:/app/model_layer/artifacts

volumes:
  postgres_data:
  model_artifacts:
